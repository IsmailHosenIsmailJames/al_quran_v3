Builds:
  - versionName: 4.4.2
    versionCode: 106
    commit: v4.4.2-foss
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.50.1
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - (sdkmanager "platforms;android-37.0" || /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
        "platforms;android-37.0" || true)
      - bash android/prepare_sdk.sh || true
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build: $$flutter$$/bin/flutter build apk --release --android-skip-build-dependency-validation
      || (bash android/prepare_sdk.sh && $$flutter$$/bin/flutter build apk --release
      --android-skip-build-dependency-validation)

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+-foss$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
